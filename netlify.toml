  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
