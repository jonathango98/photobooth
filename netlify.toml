# /preview/* (slideshow): framable by Side Quest only. Single CSP, no
# X-Frame-Options (it cannot express an allowlist).
# Verified on deploy preview: "/preview/" (trailing slash, no file) ALSO
# matches "/:file" and gets X-Frame-Options: DENY, while
# "/preview/index.html" gets only this rule. So the slideshow link must use
# /preview/index.html (superadmin.js slideshowUrl).
# TODO: replace the placeholders with the real Side Quest production and
# staging domains (space-separated origins, https only). Do NOT add
# *.up.railway.app.
[[headers]]
  for = "/preview/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=*, microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://photobooth-server-production.up.railway.app; media-src 'self' blob: https:; worker-src 'self'; frame-ancestors 'self' https://SIDEQUEST-PROD-DOMAIN https://SIDEQUEST-STAGING-DOMAIN"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
